name: 发布中文官网

on:
  push:
    branches: [main]
    paths:
      - website/**
      - appcast.xml
      - VERSION
      - .github/workflows/pages.yml
  workflow_dispatch:
  workflow_run:
    workflows: ["发布 Tunnelful macOS 应用"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release-state:
    name: 确认公开发布资产
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.release.outputs.ready }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
      - name: 确认当前版本已经发布
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          defer_or_fail() {
            echo "$1" >&2
            if [[ "$GITHUB_EVENT_NAME" == 'workflow_run' ]]; then
              exit 1
            fi
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          }
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION 格式无效：$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release_json="$(gh release view "v$version" --json isDraft,assets 2>/dev/null || true)"
          if [[ -z "$release_json" ]]; then
            defer_or_fail "v$version 尚未发布，官网保持当前线上版本，等待发布工作流成功后再切版。"
          fi
          if [[ "$(jq -r '.isDraft' <<< "$release_json")" != 'false' ]]; then
            defer_or_fail "v$version 仍是草稿 Release，官网暂不切版。"
          fi
          required_assets=(
            "Tunnelful-$version-arm64.dmg"
            "Tunnelful-$version-arm64.dmg.sha256"
            "Tunnelful-$version-x86_64.dmg"
            "Tunnelful-$version-x86_64.dmg.sha256"
            'appcast.xml'
          )
          for asset in "${required_assets[@]}"; do
            if ! jq -e --arg asset "$asset" '.assets | any(.name == $asset and .state == "uploaded")' <<< "$release_json" >/dev/null; then
              defer_or_fail "v$version 缺少已上传的发布资产：$asset；官网暂不切版。"
            fi
          done
          echo 'ready=true' >> "$GITHUB_OUTPUT"

  build:
    name: 构建网站
    needs: release-state
    if: needs.release-state.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      TUNNELFUL_PRIVATE_SCAN_PATTERN: ${{ secrets.TUNNELFUL_PRIVATE_SCAN_PATTERN }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: 使用对应 GitHub Release 的 Sparkle 更新源
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tunnelful-appcast website/public
          gh release download "v${{ needs.release-state.outputs.version }}" \
            --pattern 'appcast.xml' \
            --dir /tmp/tunnelful-appcast
          cp /tmp/tunnelful-appcast/appcast.xml website/public/appcast.xml
          echo '已使用对应 GitHub Release 中的 Sparkle 更新源。'
      - name: 确认更新源包含当前版本
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          bundle_version="${version%%-*}"
          if ! grep -Fq "<sparkle:shortVersionString>$bundle_version</sparkle:shortVersionString>" website/public/appcast.xml \
            || ! grep -Fq "/releases/download/v$version/Tunnelful-$version-arm64.dmg" website/public/appcast.xml \
            || ! grep -Fq "/releases/download/v$version/Tunnelful-$version-x86_64.dmg" website/public/appcast.xml; then
            echo "GitHub Pages 使用的更新源未完整包含 $version。" >&2
            exit 1
          fi
      - name: 检查公开内容
        run: bash scripts/check-public-content.sh
      - name: 安装锁定依赖
        run: npm ci --prefix website
      - name: 检查网站代码
        run: npm run --prefix website lint
      - name: 构建静态网站
        run: npm run --prefix website build:pages
      - name: 整理 Pages 根目录
        run: cp website/dist/client/404.html website/dist/client/Tunnelful/404.html
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6
      - name: 上传网站产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist/client/Tunnelful

  deploy:
    name: 部署网站
    if: needs.release-state.outputs.ready == 'true' && needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [release-state, build]
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
