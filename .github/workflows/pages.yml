name: 发布中文官网

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建网站
    runs-on: ubuntu-latest
    env:
      TUNNELFUL_PRIVATE_SCAN_PATTERN: ${{ secrets.TUNNELFUL_PRIVATE_SCAN_PATTERN }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: 检查公开内容
        run: bash scripts/check-public-content.sh
      - name: 安装锁定依赖
        run: npm ci --prefix website
      - name: 检查网站代码
        run: npm run --prefix website lint
      - name: 构建静态网站
        run: npm run --prefix website build:pages
      - name: 整理 Pages 根目录
        run: cp website/dist/client/404.html website/dist/client/Tunnelful/404.html
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6
      - name: 上传网站产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist/client/Tunnelful

  deploy:
    name: 部署网站
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
