name: 发布中文官网

on:
  push:
    branches: [main]
    paths:
      - website/**
      - appcast.xml
      - VERSION
      - .github/workflows/pages.yml
  workflow_dispatch:
  workflow_run:
    workflows: ["发布 Tunnelful macOS 应用"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建网站
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      TUNNELFUL_PRIVATE_SCAN_PATTERN: ${{ secrets.TUNNELFUL_PRIVATE_SCAN_PATTERN }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: 使用最新 GitHub Release 的 Sparkle 更新源
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tunnelful-appcast website/public
          if gh release download --pattern 'appcast.xml' --dir /tmp/tunnelful-appcast; then
            cp /tmp/tunnelful-appcast/appcast.xml website/public/appcast.xml
            echo '已使用最新 GitHub Release 中的 Sparkle 更新源。'
          elif [[ -f website/public/appcast.xml ]]; then
            echo '最新 GitHub Release 没有 appcast.xml，沿用仓库中的更新源。'
          else
            echo '缺少 Sparkle 更新源。' >&2
            exit 1
          fi
      - name: 确认更新源包含当前版本
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! grep -Fq "<sparkle:shortVersionString>$version</sparkle:shortVersionString>" website/public/appcast.xml; then
            echo "GitHub Pages 使用的更新源未包含 $version。" >&2
            exit 1
          fi
      - name: 检查公开内容
        run: bash scripts/check-public-content.sh
      - name: 安装锁定依赖
        run: npm ci --prefix website
      - name: 检查网站代码
        run: npm run --prefix website lint
      - name: 构建静态网站
        run: npm run --prefix website build:pages
      - name: 整理 Pages 根目录
        run: cp website/dist/client/404.html website/dist/client/Tunnelful/404.html
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6
      - name: 上传网站产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist/client/Tunnelful

  deploy:
    name: 部署网站
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
